<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='img/main-logo.png') }}" />
    <title>Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css.map') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}" />
    <style>
      /* تعديل خاص لتوسيط الزر ومحاذاة النص */
      .speechrecord .mainspeechbox {
        padding: 20px;
        text-align: left;
        height: auto;
        border-radius: 20px;
        box-shadow: 1px 1px 2px #ddd, -1px -1px 2px #dddd;
        transition: var(--main-transition);
      }
      .speechrecord .mainspeechbox .btn-wrapper {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <style>
      .speechrecord .mainspeechbox {
        padding: 20px;
        text-align: left;
        height: 390px;
        border-radius: 20px;
        box-shadow: 1px 1px 2px #ddd, -1px -1px 2px #dddd;
        transition: var(--main-transition);
      }
    
      .speechrecord .mainspeechbox h4 {
        text-align: center; /* توسيط عنوان الصندوق */
      }
    
      .speechrecord .mainspeechbox .btn-wrapper {
        text-align: center;
        margin-top: 20px;
      }
    </style>
    
    <header id="header" class="header">
      <div class="container">
        <div class="row">
          <div class="col-lg-3 col-md-2 col-sm-12 col-12">
            <a class="linklogo" href="#">
              <img src="{{ url_for('static', filename='img/main-logo.png') }}" alt="logo" />
            </a>
            <span class="menubtn"><i class="fa-solid fa-bars"></i></span>
          </div>
          <div class="col-lg-7 col-md-7 col-sm-12 col-12">
            <ul>
              <li><a href="{{ url_for('home') }}">Home</a></li>
              <li><a href="{{ url_for('about') }}">About</a></li> 
            </ul>
          </div>
          <div class="col-lg-2 col-md-3 col-sm-12 col-12">
            <div class="btnheader">
              <a class="mainbtn linkdown" href="#speechrecord">Try It Now</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section id="speechrecord" class="speechrecord">
      <div class="container">
        <div class="uplogo">
          <img src="{{ url_for('static', filename='img/main-logo.png') }}" alt="" />
        </div>

        <div class="row">
          <div class="col-md">
            <div class="mainspeechbox">
              <h4>Convert Your voice into ASL</h4>
              
              <!-- الزر الآن داخل div لتوسيطه -->
              <div class="btn-wrapper">
                <form method="POST">
                  <button id="record" type="submit">
                    <span><i class="fa-solid fa-microphone-lines"></i></span>
                    Start Recording
                  </button>
                </form>
              </div>

              {% if original_text %}
                <div class="content-box">
                  <h5>You said:</h5>
                  <p>{{ original_text }}</p>

                  <h5>Key words:</h5>
                  <p>
                    {% for word in words %}
                      {{ word }}{% if not loop.last %} - {% endif %}
                    {% endfor %}
                  </p>                  
                </div>
              {% endif %}
            </div>
          </div>

          <div class="col-md">
            <div class="mainspeechbox">
              <h4>ASL</h4>
          
            {% if images %}
              <div class="content-box" style="margin-top: 20px; text-align: center;">
                <img id="asl-slideshow" src="{{ url_for('static', filename=images[0]) }}"
                  alt="ASL Image"
                  style="width: 120px; max-width: 100%; height: auto; border-radius: 10px;" />
              </div>

              <script>
                const images = [
                  {% for image in images %}
                    "{{ url_for('static', filename=image) }}"{% if not loop.last %},{% endif %}
                  {% endfor %}
                ];

                let index = 0;
                const imgElement = document.getElementById("asl-slideshow");

                const slideshow = setInterval(() => {
                  index += 1;

                  if (index >= images.length) {
                    // خلصنا الصور – نوقف التايمر ونخفي الصورة
                    clearInterval(slideshow);
                    imgElement.style.display = "none";
                  } else {
                  imgElement.src = images[index];
                  }
                }, 2500); // كل 2.5 ثانية
              </script>
            {% endif %}

          
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>All Rights Are Reserved &copy;</p>
      </div>
    </footer>

    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/all.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js.map') }}"></script>
    <script src="{{ url_for('static', filename='js/myscript.js') }}"></script>
  </body>
</html>
